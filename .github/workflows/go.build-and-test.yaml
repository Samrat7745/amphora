name: Go build and test (amphora)
on:
  pull_request:
    paths:
      - 'go/**'
      - 'amphora-service/charts/**'
      - '.github/workflows/go.build-and-test.yaml'
  push:
    branches:
      - 'master'
    paths:
      - 'go/**'
jobs:
  go-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit, property and contract tests (race detector, coverage)
        run: |
          go test -race -p 2 -coverprofile=cover.out -coverpkg=./... $(go list ./... | grep -v /e2e)
      - name: Check coverage floor
        run: scripts/check-coverage.sh cover.out
      - name: Fuzz (15s per target)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          while read -r pkg target; do
            echo "::group::fuzz $pkg $target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s -parallel 2 "$pkg"
            echo "::endgroup::"
          done <<'EOF'
          ./internal/model FuzzParseMaskedInput
          ./internal/model FuzzParseSecretShare
          ./internal/model FuzzParseExchangeObject
          ./internal/model FuzzParseTag
          ./internal/model FuzzParseTagFilters
          ./internal/model FuzzURLDecode
          ./internal/javaser FuzzDecodeInputMaskList
          ./internal/javaser FuzzDecodeExchangeObject
          ./internal/javaser FuzzDecodeUploadResponse
          ./internal/javaser FuzzRoundTripInputMaskList
          ./internal/javaser FuzzRoundTripExchangeObject
          ./internal/jwt FuzzUserID
          EOF
      - name: Build image
        run: docker build -t amphora-go:ci .
